<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiabEats Admin · Feedback</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7fdf9; color: #1a1a1a; min-height: 100vh; }

    .topbar { background: #166534; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .topbar-icon { font-size: 20px; }
    .topbar-title { color: #fff; font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .topbar-sub { color: rgba(255,255,255,0.6); font-size: 13px; margin-left: auto; }

    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 52px); }
    .login-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 36px; width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .login-card h2 { font-size: 20px; margin-bottom: 6px; }
    .login-card p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .login-card input { width: 100%; border: 1px solid #e2e8f0; border-radius: 10px; padding: 11px 14px; font-size: 15px; outline: none; transition: border-color .15s; }
    .login-card input:focus { border-color: #166534; }
    .login-card button { width: 100%; margin-top: 12px; background: #166534; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .login-card button:hover { opacity: .88; }
    .login-error { color: #991b1b; font-size: 13px; margin-top: 10px; display: none; }

    .dashboard { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }
    .stats-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px 22px; flex: 1; min-width: 140px; }
    .stat-value { font-size: 32px; font-weight: 700; color: #166534; line-height: 1; }
    .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.6px; }

    .section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.7px; color: #94a3b8; text-transform: uppercase; margin-bottom: 12px; }

    .feedback-list { display: flex; flex-direction: column; gap: 10px; }
    .feedback-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 18px; }
    .feedback-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .feedback-type { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
    .type-feedback { background: #dcfce7; color: #15803d; }
    .type-request { background: #fef9c3; color: #854d0e; }
    .type-general { background: #e0f2fe; color: #075985; }
    .feedback-time { font-size: 12px; color: #94a3b8; margin-left: auto; }
    .feedback-message { font-size: 14px; line-height: 1.6; color: #334155; }
    .feedback-contact { font-size: 12px; color: #94a3b8; margin-top: 6px; }

    .empty { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 15px; }
    .refresh-btn { background: none; border: 1px solid #e2e8f0; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: #64748b; display: flex; align-items: center; gap: 6px; margin-left: auto; margin-bottom: 12px; transition: border-color .15s; }
    .refresh-btn:hover { border-color: #166534; color: #166534; }
    .section-header { display: flex; align-items: center; margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-icon">🌿</span>
  <span class="topbar-title">DiabEats Admin</span>
  <span class="topbar-sub">Feedback Dashboard</span>
</div>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h2>Admin Login</h2>
    <p>Enter your admin password to view feedback</p>
    <input type="password" id="passwordInput" placeholder="Admin password" />
    <button onclick="login()">View Feedback</button>
    <div class="login-error" id="loginError">Incorrect password</div>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="stats-row" id="statsRow"></div>

  <div class="section-header">
    <div class="section-title">User Feedback</div>
    <button class="refresh-btn" onclick="loadFeedback()">↻ Refresh</button>
  </div>
  <div class="feedback-list" id="feedbackList"></div>
</div>

<script>
  let token = '';

  document.getElementById('passwordInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const pw = document.getElementById('passwordInput').value.trim();
    if (!pw) return;
    token = pw;
    const ok = await loadFeedback();
    if (ok) {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadStats();
    } else {
      document.getElementById('loginError').style.display = 'block';
      token = '';
    }
  }

  async function loadStats() {
    try {
      const res = await fetch('/api/admin/stats', { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const data = await res.json();
      const row = document.getElementById('statsRow');
      const items = [
        { label: 'Total Logs', value: data.totalLogs ?? 0 },
        { label: 'Safe Meals', value: data.safeMeals ?? 0 },
        { label: 'Caution Meals', value: data.cautionMeals ?? 0 },
        { label: 'High Impact', value: data.avoidMeals ?? 0 },
        { label: 'Top Restaurant', value: data.topRestaurant ?? '—' },
      ];
      row.innerHTML = items.map(i => `
        <div class="stat-card">
          <div class="stat-value">${i.value}</div>
          <div class="stat-label">${i.label}</div>
        </div>
      `).join('');
    } catch {}
  }

  async function loadFeedback() {
    try {
      const res = await fetch('/api/admin/feedback', { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return false;
      const data = await res.json();
      const list = document.getElementById('feedbackList');
      if (!data.feedback || data.feedback.length === 0) {
        list.innerHTML = '<div class="empty">No feedback yet</div>';
        return true;
      }
      const sorted = [...data.feedback].sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());
      list.innerHTML = sorted.map(f => {
        const type = f.type === 'restaurant_request' ? 'request' : f.type === 'feedback' ? 'feedback' : 'general';
        const typeLabel = type === 'request' ? 'Restaurant Request' : type === 'feedback' ? 'Feedback' : f.type || 'General';
        const date = new Date(f.createdAt).toLocaleString();
        return `
          <div class="feedback-card">
            <div class="feedback-meta">
              <span class="feedback-type type-${type}">${typeLabel}</span>
              <span class="feedback-time">${date}</span>
            </div>
            <div class="feedback-message">${escHtml(f.message || '')}</div>
            ${f.contact ? `<div class="feedback-contact">Contact: ${escHtml(f.contact)}</div>` : ''}
          </div>
        `;
      }).join('');
      return true;
    } catch {
      return false;
    }
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
